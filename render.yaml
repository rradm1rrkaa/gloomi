services:
  - type: web
    name: gloomi-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm db:generate && corepack pnpm build:api
    startCommand: corepack pnpm --filter @gloomi/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_DELIVERY_MODE
        value: direct
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RATE_LIMIT_STORE
        value: memory
      - key: COOKIE_SAME_SITE
        value: lax
      - key: MEDIA_STORAGE_PROVIDER
        value: s3
      - key: AWS_REGION
        value: auto
      - key: SMTP_FROM_NAME
        value: Gloomi
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: EMAIL_CODE_PEPPER
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: API_PUBLIC_ORIGIN
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
